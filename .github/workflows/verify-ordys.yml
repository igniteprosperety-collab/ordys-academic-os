name: Verify ORDYS

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordys-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      VITE_SUPABASE_PROJECT_ID: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tracked environment file contains only public variables
        run: node scripts/verify-tracked-env.mjs

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript types
        run: bun run typecheck

      - name: Run ORDYS static security and billing verification
        run: node scripts/verify-ordys-static.mjs

      - name: Run unit tests
        run: bun run test

      - name: Verify lint and formatting
        run: bun run lint

      - name: Build production bundle
        run: bun run build

  database:
    name: Apply migrations to disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      - name: Start disposable local Supabase services
        run: supabase start --exclude studio,mailpit,storage-api,imgproxy,edge-runtime,logflare,vector

      - name: Apply the complete migration chain from an empty database
        run: supabase db reset --local --no-seed

      - name: Configure local API endpoint for anonymous integration tests
        shell: bash
        run: |
          set -euo pipefail
          status="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p' | head -n 1 | sed -e 's/^"//' -e 's/"$//')"
          anon_key="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY=//p' | head -n 1 | sed -e 's/^"//' -e 's/"$//')"
          service_role_key="$(printf '%s\n' "$status" | sed -n 's/^SERVICE_ROLE_KEY=//p' | head -n 1 | sed -e 's/^"//' -e 's/"$//')"
          test -n "$api_url"
          test -n "$anon_key"
          test -n "$service_role_key"
          {
            printf 'SUPABASE_URL=%s\n' "$api_url"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$anon_key"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'VITE_SUPABASE_URL=%s\n' "$api_url"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$anon_key"
          } >> "$GITHUB_ENV"

      - name: Install Bun for local Data API tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies for local Data API tests
        run: bun install --frozen-lockfile

      - name: Verify anonymous Data API isolation against local Supabase
        run: bun run test tests/data-isolation.test.ts

      - name: Verify signup, login, session refresh and password update against local Auth
        run: bun run test tests/auth-session.integration.test.ts

      - name: Run database security and integrity tests (pgTAP)
        run: supabase test db

      - name: Stop local Supabase services
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was not installed; no local stack to stop."
          fi
