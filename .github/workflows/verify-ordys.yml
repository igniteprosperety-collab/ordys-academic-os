name: Verify ORDYS

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordys-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      VITE_SUPABASE_PROJECT_ID: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript types
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Verify lint and formatting
        run: bun run lint

      - name: Build production bundle
        run: bun run build
