name: Verify ORDYS

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordys-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      VITE_SUPABASE_PROJECT_ID: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript types
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Verify lint and formatting
        run: bun run lint

      - name: Build production bundle
        run: bun run build

  database:
    name: Apply migrations to disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Start disposable local Supabase services
        run: supabase start --exclude studio,mailpit,storage-api,imgproxy,edge-runtime,logflare,vector

      - name: Apply the complete migration chain from an empty database
        run: supabase db reset --local --no-seed

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
