name: Hosted runner owner-scope probe

on:
  push:
    branches:
      - diagnostics/runner-owner-scope-2026-11-09

permissions: {}

jobs:
  ubuntu-24-04:
    name: Public repo probe ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_name=${RUNNER_NAME}"
          uname -a

  ubuntu-latest:
    name: Public repo probe ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_name=${RUNNER_NAME}"
          uname -a
