name: Ordys Student Core - Free Verification

on:
  push:
    branches:
      - ci/student-v1-free-validation

permissions:
  contents: read

concurrency:
  group: ordys-student-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      VITE_SUPABASE_PROJECT_ID: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Checkout current Lovable snapshot
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite (Supabase integration tests disabled)
        run: bun run test

      - name: Run ESLint
        run: bun run lint

      - name: Build production bundle
        run: bun run build
